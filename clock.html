<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Date & Time</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
    }

    .clock-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #time {
      font-size: clamp(120px, 16vw, 300px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    #date {
      margin-top: 40px;
      font-size: clamp(42px, 5vw, 90px);
      font-weight: 400;
      color: #FFCD00;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div class="clock-container">
    <div id="time"></div>
    <div id="date"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const time = now.toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      });

      const date = now.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      document.getElementById("time").textContent = time;
      document.getElementById("date").textContent = date;
    }

    updateClock();

    // Update frequently enough that the minute changes promptly.
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
